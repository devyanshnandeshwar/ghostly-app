# Local development dependencies only.
#
# There is no application service here any more. The API runs on Render and the
# SPA on Vercel; locally you run them directly (`bun run dev` in each), so this
# file exists purely to provide the two datastores.
#
# Ports are published to the host on purpose -- unlike the old all-in-Docker
# setup, the server process runs outside Docker and has to reach them.
services:
  mongo:
    image: mongo:7
    container_name: ghostly-mongo
    restart: unless-stopped
    # WiredTiger sizes its cache against HOST ram inside a container and would
    # otherwise claim a substantial share of the machine to serve two small
    # collections.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ghostly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mongo_data:
