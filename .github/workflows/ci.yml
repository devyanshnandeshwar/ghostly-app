# Gates every change on the checks that were previously never run anywhere.
#
# The pipeline this replaces built Docker images and pushed them to a registry
# the deploy script then ignored, because the script rebuilt from source on the
# VM. It ran no tests, no typecheck, no lint. Deployment is now git-push on
# Vercel and Render, so CI's only job is to stop a broken commit reaching them.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Read from .bun-version so CI, local and Render cannot drift. Render
          # defaults to 1.3.14, which cannot import mongoose at all.
          bun-version-file: server/.bun-version

      - run: bun install --frozen-lockfile

      # Bun strips types rather than checking them, so without this step no
      # type error would ever fail a build.
      - name: Typecheck
        run: bun run typecheck

      # `bun run test`, not `bun test`: the script passes --isolate, which gives
      # each test file its own module registry. Without it a mock.module in one
      # file leaks into every file that runs after it, so the suite passes or
      # fails depending on file order.
      - name: Test
        run: bun run test

      # Enforced by scripts/check-coverage.mjs rather than bunfig, which gates
      # per-file as a scalar and did not gate at all as a table.
      - name: Coverage
        run: bun run test:coverage

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: server/.bun-version

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Coverage
        run: bun run test:coverage

      # `build` is `tsc -b && vite build`, so this typechecks the client too.
      #
      # CI=true also arms scripts/check-deploy-config.mjs, which fails the build
      # if vercel.json still carries the CSP placeholder or the API URLs are
      # unset -- the misconfiguration that otherwise ships an app that loads and
      # silently cannot reach its own backend.
      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
        run: bun run build

  # ---------------------------------------------------------------- deploy
  #
  # Vercel and Render both auto-deploy on push by default, which means a red
  # build ships. Point both at THIS job instead (disable their git auto-deploy)
  # so tests are a gate rather than a report published after the fact.
  #
  # Skipped entirely if the secrets are absent, so a fork or a first-run repo
  # does not fail CI on deployment it was never meant to do.
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [server, client]
    runs-on: ubuntu-latest
    concurrency:
      # One deploy at a time; a newer push supersedes an in-flight older one.
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: server/.bun-version

      # Build the SPA BEFORE anything ships.
      #
      # Render used to be kicked first, so a Vercel build that failed here --
      # and check-deploy-config.mjs fails it deliberately, e.g. on an unreplaced
      # CSP placeholder -- left the API already updated and the SPA on its old
      # build. A split deploy is the one outcome worse than not deploying, since
      # in practice the two halves are versioned together.
      #
      # `vercel build` writes .vercel/output; the deploy step below uploads that
      # exact artifact with --prebuilt rather than building a second time.
      - name: Build SPA (gates the whole deploy)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: client
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN not set — skipping SPA build."
            exit 0
          fi
          bunx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          bunx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy API to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "RENDER_DEPLOY_HOOK not set — skipping API deploy."
            exit 0
          fi
          # Render answers 200 with a JSON body naming the queued deploy. A
          # non-2xx here means the hook is wrong, and silently ignoring that
          # would leave the API on an old build while the SPA moved on.
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
          echo "API deploy queued."

      - name: Deploy SPA to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: client
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN not set — skipping SPA deploy."
            exit 0
          fi
          bunx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
