version: '3.9'

services:

  mongo:
    image: mongo:7
    container_name: ghostly-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - ghostly-net


  ai-model:
    build:
      context: .
      dockerfile: ai-model/Dockerfile
    container_name: ghostly-ai
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - ghostly-net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ghostly-server
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "5000"
    depends_on:
      - mongo
      - ai-model
    networks:
      - ghostly-net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
        VITE_BASE_PATH: /ghostly
    container_name: ghostly-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - ghostly-net

volumes:
  mongo_data:

networks:
  ghostly-net:
    driver: bridge
