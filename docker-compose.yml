version: '3.9'

services:

  mongo:
    image: mongo:7
    container_name: ghostly-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - ghostly-net

  redis:
    image: redis:7-alpine
    container_name: ghostly-redis
    restart: unless-stopped
    networks:
      - ghostly-net

  ai-model:
    build:
      context: .
      dockerfile: ai-model/Dockerfile
    container_name: ghostly-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - ghostly-net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ghostly-server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ghostly
      REDIS_URI: redis://redis:6379
      CLIENT_URL: http://localhost
      NODE_ENV: production
      SESSION_SECRET: change_me_in_production
      AI_MODEL_URL: http://ai-model:8000/api/verify-gender
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
      - ai-model
    networks:
      - ghostly-net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
        VITE_BASE_PATH: /ghostly
    container_name: ghostly-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - ghostly-net

volumes:
  mongo_data:

networks:
  ghostly-net:
    driver: bridge
